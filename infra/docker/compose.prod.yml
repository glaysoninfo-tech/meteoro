# Produção assistida (indoor) — sobe a plataforma completa numa máquina só.
#
#   docker compose -f infra/docker/compose.prod.yml --env-file infra/docker/.env.prod up -d
#
# Pré-requisito: copiar .env.prod.example para .env.prod e preencher os segredos.
# Somente o proxy (Caddy) expõe portas ao host; os demais serviços vivem na
# rede interna do compose.

name: meteoro-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meteoro}
      POSTGRES_USER: ${POSTGRES_USER:-meteoro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD em .env.prod}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meteoro} -d ${POSTGRES_DB:-meteoro}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD em .env.prod}",
        "--appendonly", "yes",
        "--maxmemory", "256mb",
        "--maxmemory-policy", "noeviction",
      ]
    volumes:
      - redis-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *default-logging

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER em .env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD em .env.prod}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks: [internal]
    logging: *default-logging

  migrate:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      disable: true
    logging: *default-logging

  api:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - raw-data:/data/raw
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal, edge]
    expose: ["8000"]
    logging: *default-logging

  worker:
    build:
      context: ../..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.modules.ingestion.worker"]
    env_file: .env.prod
    volumes:
      - raw-data:/data/raw
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      disable: true
    logging: *default-logging

  backup:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/opt/meteoro/backup.sh"]
    environment:
      PGHOST: postgres
      POSTGRES_DB: ${POSTGRES_DB:-meteoro}
      POSTGRES_USER: ${POSTGRES_USER:-meteoro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-02}
    volumes:
      - ./backup.sh:/opt/meteoro/backup.sh:ro
      # Aponte BACKUP_DIR para disco secundário ou NAS — nunca o mesmo disco do banco.
      - ${BACKUP_DIR:-./backups}:/backups
      - raw-data:/raw:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      disable: true
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
    networks: [edge]
    logging: *default-logging

networks:
  internal:
    internal: true
  edge:

volumes:
  postgres-data:
  redis-data:
  minio-data:
  raw-data:
  caddy-data:
  caddy-config:
