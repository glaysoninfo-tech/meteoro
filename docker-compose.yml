services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: meteoro-postgres
    environment:
      POSTGRES_DB: meteoro
      POSTGRES_USER: meteoro
      POSTGRES_PASSWORD: meteoro
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: meteoro-redis
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: meteoro-minio
    environment:
      MINIO_ROOT_USER: meteoro
      MINIO_ROOT_PASSWORD: meteoro123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:

