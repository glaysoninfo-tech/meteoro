name: backend-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancela execuções superadas do mesmo branch/PR em vez de deixá-las
# queimando minutos até o fim.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan de segredos (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: meteoro_ci
          POSTGRES_USER: meteoro
          POSTGRES_PASSWORD: meteoro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meteoro -d meteoro_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://meteoro:meteoro@localhost:5432/meteoro_ci
      # A suíte de testes roda contra o mesmo PostGIS, com schema criado
      # pela cadeia real de migrações (ver tests/conftest.py).
      TEST_DATABASE_URL: postgresql+psycopg://meteoro:meteoro@localhost:5432/meteoro_ci
      AUTH_MODE: local
      JWT_SECRET_KEY: ci-only-secret-not-for-production
      INGESTION_NETWORK_ALLOWED_HOSTS: api.example.org
      INGESTION_NETWORK_ALLOWED_PORTS: "443,1883,4840"
      INGESTION_HTTP_ALLOWED_SCHEMES: https
      INGESTION_S3_ALLOWED_BUCKETS: meteoro-ci-bucket
      INGESTION_SCHEDULER_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Mesma minor da imagem de produção (backend/Dockerfile).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Static analysis
        working-directory: backend
        run: ruff check app tests

      - name: Ensure single Alembic head
        working-directory: backend
        run: |
          python - <<'PY'
          from alembic.config import Config
          from alembic.script import ScriptDirectory

          script = ScriptDirectory.from_config(Config("alembic.ini"))
          heads = script.get_heads()
          if len(heads) != 1:
              raise SystemExit(f"ERRO: esperado 1 head de migração, encontrados {len(heads)}: {heads}")
          print(f"OK: head único ({heads[0]})")
          PY

      - name: Migrate PostgreSQL/PostGIS schema
        working-directory: backend
        run: alembic upgrade head

      - name: Automated tests
        working-directory: backend
        # --strict-markers pega marker digitado errado; o código de saída 5
        # (nenhum teste coletado) passa a falhar o job.
        run: pytest -q --strict-markers

  docker-build:
    # Só faz sentido gastar o build se a suíte passou.
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem do backend
        # Contexto é a raiz do repositório: o Dockerfile faz COPY backend/ e
        # COPY frontend/, então buildar de dentro de backend/ quebraria.
        run: docker build -f backend/Dockerfile -t meteoro-backend:ci .
